name: CI Build

# 重点 1：同时监听 main 和 master 分支的推送和 PR
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取源代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 设置 Java 环境（ViaForge 官方指定使用 Java 21）
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    # 3. 赋予 Gradle 脚本执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 执行编译构建
    - name: Build with Gradle
      run: ./gradlew build

    # 重点 2 & 3：合并为一个路径打包，并直接提供下载产物
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ViaForge-1.8.9-Build-Jars
        # 通配符会将所有子模块（1.8.9和1.12.2）下的 jar 包汇总到这一个任务里输出
        path: |
          viaforge-mc*/build/libs/*.jar